[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusrag"
version = "1.0.0"
authors = [
  { name="Rishabh Raj", email="rishabhraj74918@gmail.com" },
]
